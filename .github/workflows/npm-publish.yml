name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token: write — required for npm Trusted Publishing (OIDC). No
    # NPM_TOKEN secret: npm exchanges this workflow's OIDC token for a
    # short-lived publish credential and attaches provenance automatically.
    # Configured on npmjs.com under @nitra/cfr → Settings → Trusted Publisher
    # (publisher: GitHub Actions, org/repo: nitra/cfr, workflow: this file).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # npm Trusted Publishing requires npm >= 11.5.1 and Node >= 22.14.0.
      # setup-node MUST be v6+: v4/v5 always write
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into .npmrc even
      # when NODE_AUTH_TOKEN is unset, which makes npm treat auth as already
      # configured and skip the OIDC exchange entirely (404 on publish) — see
      # https://github.com/actions/setup-node/issues/1551. v6 handles OIDC
      # correctly and needs no NODE_AUTH_TOKEN at all.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@11.6.2

      - run: npm ci

      - run: npm test

      - name: Verify published runtime has no legacy discovery
        run: |
          npm pack --dry-run --json | node --input-type=module -e '
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            const files = JSON.parse(input)[0].files.map(({path}) => path);
            if (files.some(path => /kcc-inventory|k8s-rest/.test(path))) process.exit(1);
            if (!files.includes("lib/contract.mjs")) process.exit(1);
          '

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm publish --access public
