name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token: write — required for npm Trusted Publishing (OIDC). No
    # NPM_TOKEN secret: npm exchanges this workflow's OIDC token for a
    # short-lived publish credential and attaches provenance automatically.
    # Configured on npmjs.com under @nitra/cfr → Settings → Trusted Publisher
    # (publisher: GitHub Actions, org/repo: nitra/cfr, workflow: this file).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # npm Trusted Publishing requires npm >= 11.5.1 and Node >= 22.14.0.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - run: node --test test/cli.test.mjs

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm publish --access public
